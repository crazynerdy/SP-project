  # ============================================================
  # 10.x 财务预算 (1 sheet)
  # ============================================================
  - sheet_id: "10.1"
    sheet_name: "10.1 财务预算"
    agent_type: synthesis
    depends_on: ["3.2", "6.1", "6.2", "6.3"]
    mcp_fields: []
    schema_class: CellMapOutput
    output_format: cells
    enabled: true
    description: "预测战略执行过程中的公司财务预算"
