  # ============================================================
  - sheet_id: "9.1"
    sheet_name: "9.1 企业文化"
    agent_type: null
    depends_on: []
    mcp_fields: []
    schema_class: null
    output_format: cells
    enabled: false
    description: "支撑战略执行的企业文化、氛围和行为准则"
    process_hint: "公司填写"
    blm_module: "氛围文化"

  - sheet_id: "9.2"
    sheet_name: "9.2 数字资源"
    agent_type: null
    depends_on: []
